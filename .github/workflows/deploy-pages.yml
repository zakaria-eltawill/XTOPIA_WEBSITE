name: Deploy XTOPIA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; newer runs supersede older ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare deploy copy (strip internal/dev-only files)
        run: |
          rsync -a --exclude='.git' ./ /tmp/deploy/
          rm -rf /tmp/deploy/docs /tmp/deploy/tools /tmp/deploy/partials
          rm -f /tmp/deploy/CLAUDE.md /tmp/deploy/SKILLS.md
          rm -f /tmp/deploy/xtopia-*.md

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy from the stripped copy, not the repo root
          path: "/tmp/deploy"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
